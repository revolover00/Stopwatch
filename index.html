<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FlipDeck — flip clock, stopwatch, timer & countdown</title>
    <meta
      name="description"
      content="A split-flap flip clock with a stopwatch, countdown timer, alarm clock and study timer. Millisecond accurate, keyboard friendly, nothing to install."
    />
    <meta name="theme-color" content="#0f1115" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23111519'/%3E%3Crect x='6' y='8' width='9' height='16' rx='2' fill='%23f5c451'/%3E%3Crect x='17' y='8' width='9' height='16' rx='2' fill='%23f5c451'/%3E%3Crect x='6' y='15.25' width='20' height='1.5' fill='%23111519'/%3E%3C/svg%3E"
    />
    <script>
      // Apply the saved palette before first paint to avoid a flash of the default theme.
      (function () {
        try {
          var raw = localStorage.getItem('flipdeck.settings');
          var theme = raw ? JSON.parse(raw).theme : null;
          if (theme === 'light' || theme === 'midnight' || theme === 'sand' || theme === 'dark') {
            document.documentElement.dataset.theme = theme;
          }
        } catch (error) {
          /* keep the default dark palette */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
